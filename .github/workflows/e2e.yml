# =============================================================================
# Absolute Valheim Server - E2E Test Workflow (vanilla artifact)
# =============================================================================
# The uptime-first gate. Runs the shared end-to-end suite against the `vanilla`
# build target on every push and pull request and feeds publish.yml.
#
# The modded artifact has its own pipeline (bepinex.yml) so a mod-side breakage
# after a Valheim update can never block a vanilla release.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip server file cache'
        required: false
        default: false
        type: boolean

env:
  VALHEIM_APP_ID: '896660'
  VALHEIM_VARIANT: vanilla

jobs:
  # -------------------------------------------------------------------------
  # Static checks (fast, no Docker)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck container scripts and tests
        run: |
          shellcheck --version
          shellcheck -S error -s bash -x scripts/* tests/*.sh tests/e2e/*.sh
          # New DR/BepInEx scripts are held to the stricter bar
          shellcheck -S warning -s bash -x -e SC2034 \
            scripts/valheim-bepinex scripts/valheim-modcheck scripts/valheim-dr \
            tests/e2e/test_dr_snapshot_restore.sh tests/e2e/test_bepinex_*.sh

  e2e-tests:
    name: End-to-End Tests (vanilla)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------------
      # Checkout and Setup
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # Cache Server Files
      # ---------------------------------------------------------------------
      - name: Create cache directories
        run: |
          mkdir -p data/server
          mkdir -p data/config

      - name: Restore server file cache
        if: ${{ github.event.inputs.skip_cache != 'true' }}
        uses: actions/cache@v4
        id: server-cache
        with:
          path: data/server
          key: valheim-server-${{ env.VALHEIM_APP_ID }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            valheim-server-${{ env.VALHEIM_APP_ID }}-

      - name: Cache status
        run: |
          if [ "${{ steps.server-cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Server files restored from cache"
            ls -la data/server/ || true
          else
            echo "⚠️ No cache found, server files will be downloaded"
          fi

      # ---------------------------------------------------------------------
      # Build Docker Image
      # ---------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: vanilla
          push: false
          load: true
          tags: absolute-valheim-server:test-vanilla
          cache-from: type=gha,scope=vanilla
          cache-to: type=gha,mode=max,scope=vanilla

      # ---------------------------------------------------------------------
      # Run E2E Tests
      # ---------------------------------------------------------------------
      - name: Make test scripts executable
        run: |
          chmod +x tests/run_e2e.sh
          chmod +x tests/test_helpers.sh
          chmod +x tests/e2e/*.sh

      - name: Cleanup any existing containers
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f valheim-server 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker volume rm valheim-test-config valheim-test-server 2>/dev/null || true

      - name: Run E2E test suite
        id: e2e-tests
        run: |
          ./tests/run_e2e.sh
        env:
          TEST_TIMEOUT: 600
          STARTUP_WAIT: 300

      # ---------------------------------------------------------------------
      # Collect Artifacts (always, for debugging)
      # ---------------------------------------------------------------------
      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker logs valheim-server > test-artifacts/container.log 2>&1 || true
          docker inspect valheim-server > test-artifacts/container-inspect.json 2>&1 || true
          cp -r data/logs/* test-artifacts/ 2>/dev/null || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs-vanilla
          path: test-artifacts/
          retention-days: 7

      # ---------------------------------------------------------------------
      # Update Server File Cache
      # ---------------------------------------------------------------------
      - name: Save server files to cache
        if: always()
        run: |
          # Copy server files from container volume if tests ran
          if docker ps -a | grep -q valheim-server; then
            echo "Extracting server files for cache..."
            docker cp valheim-server:/opt/valheim/server/. data/server/ 2>/dev/null || true
            ls -la data/server/ | head -20 || true
          fi

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f valheim-server 2>/dev/null || true
          docker volume rm valheim-test-config valheim-test-server 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Build Verification (both targets, no server download)
  # -------------------------------------------------------------------------
  build-only:
    name: Build Verification (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, bepinex]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.variant }}
          push: false
          load: true
          tags: absolute-valheim-server:build-test-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Verify image structure
        run: |
          IMG=absolute-valheim-server:build-test-${{ matrix.variant }}
          # Required scripts exist
          docker run --rm "$IMG" ls -la /opt/valheim/scripts/
          for s in bootstrap valheim-server valheim-updater valheim-backup valheim-dr valheim-modcheck valheim-bepinex healthcheck; do
            docker run --rm "$IMG" test -x "/opt/valheim/scripts/$s" || { echo "missing script: $s"; exit 1; }
          done
          # Scripts parse
          docker run --rm "$IMG" sh -c 'for f in /opt/valheim/scripts/*; do bash -n "$f" || exit 1; done'
          # steamcmd is installed
          docker run --rm "$IMG" ls -la /opt/steamcmd/
          # Supervisor config
          docker run --rm "$IMG" cat /etc/supervisor/conf.d/valheim.conf
          # Variant contract
          VARIANT=$(docker run --rm "$IMG" printenv VALHEIM_VARIANT)
          test "$VARIANT" = "${{ matrix.variant }}" || { echo "VALHEIM_VARIANT=$VARIANT"; exit 1; }
          # DR CLI answers without a server install
          docker run --rm "$IMG" /opt/valheim/scripts/valheim-dr status | jq -e '.variant == "${{ matrix.variant }}"'

      - name: Verify BepInEx overlay is pinned into the image
        if: matrix.variant == 'bepinex'
        run: |
          IMG=absolute-valheim-server:build-test-bepinex
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/BepInEx/core/BepInEx.Preloader.dll
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/doorstop_libs/libdoorstop_x64.so
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/start_server_bepinex.sh
          PACK=$(docker run --rm "$IMG" cat /opt/valheim/bepinex/.pack_version)
          ENVV=$(docker run --rm "$IMG" printenv BEPINEX_VERSION)
          echo "pack=$PACK env=$ENVV"
          test "$PACK" = "$ENVV"
          docker run --rm "$IMG" sh -c 'test "$(printenv BEPINEX_ENABLED)" = true && test "$(printenv MODCHECK_STRICT)" = true && test "$(printenv DR_SNAPSHOT_BEFORE_UPDATE)" = true'

      - name: Verify vanilla image carries no BepInEx
        if: matrix.variant == 'vanilla'
        run: |
          IMG=absolute-valheim-server:build-test-vanilla
          if docker run --rm "$IMG" test -d /opt/valheim/bepinex; then echo "vanilla image contains BepInEx"; exit 1; fi
          docker run --rm "$IMG" sh -c 'test "$(printenv BEPINEX_ENABLED)" = false && test "$(printenv DR_SNAPSHOT_BEFORE_UPDATE)" = false'
