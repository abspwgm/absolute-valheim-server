# =============================================================================
# Absolute Valheim Server - E2E Test Workflow (vanilla artifact)
# =============================================================================
# The uptime-first gate. Runs the shared end-to-end suite against the `vanilla`
# build target on every push and pull request and feeds publish.yml.
#
# The modded artifact has its own pipeline (bepinex.yml) so a mod-side breakage
# after a Valheim update can never block a vanilla release.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip server file cache'
        required: false
        default: false
        type: boolean

# Least privilege for GITHUB_TOKEN; no job here writes to the repo.
permissions:
  contents: read

# The self-hosted pool shares one Docker daemon across runner instances, and
# this suite uses fixed container names (valheim-server). Two runs of this
# workflow at once therefore tear down each other's containers: the symptom is
# a test failing with "cannot exec in a stopped state" while the container sits
# in Status=removing with ExitCode 0.
#
# Serialised per repository rather than per ref, because the collision is over
# container names, not over the branch. Different games still run in parallel,
# which is what the extra runner instances are for. In-progress runs are not
# cancelled: killing a suite mid-flight leaves containers and volumes behind on
# a runner that is not thrown away between jobs.
concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: false

env:
  VALHEIM_APP_ID: '896660'
  VALHEIM_VARIANT: vanilla

jobs:
  # -------------------------------------------------------------------------
  # Static checks (fast, no Docker)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck container scripts and tests
        run: |
          shellcheck --version
          shellcheck -S error -s bash -x scripts/* tests/*.sh tests/e2e/*.sh
          # New DR/BepInEx scripts are held to the stricter bar
          shellcheck -S warning -s bash -x -e SC2034 \
            scripts/valheim-bepinex scripts/valheim-modcheck scripts/valheim-dr \
            tests/e2e/test_dr_snapshot_restore.sh tests/e2e/test_bepinex_*.sh

      - name: Unit tests (no Docker)
        run: |
          # tests/test_helpers.sh is the shared e2e library, not a test.
          for t in tests/test_*.sh; do
            case "$(basename "${t}")" in test_helpers.sh) continue ;; esac
            echo "--- ${t}"
            bash "${t}"
          done

  e2e-tests:
    name: End-to-End Tests (vanilla)
    # Fork pull requests NEVER run on our own hardware: a fork can change the
    # workflow and the tests it runs, and this runner sits on the same machine
    # as the game servers. They go to a GitHub-hosted runner, which is free for
    # public repositories. Everything else takes the org runner pool, which has
    # the Steam depot cache and no 6-hour job limit.
    runs-on: ${{ fromJSON(
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
      && '["ubuntu-latest"]'
      || '["self-hosted","linux","x64","absolute-e2e"]') }}
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------------
      # Checkout and Setup
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ---------------------------------------------------------------------
      # Cache Server Files
      # The suite runs with USE_BIND_MOUNTS=true so ./data/server IS the
      # container's /opt/valheim/server. A restored cache therefore skips the
      # ~1GB Steam download (SteamCMD still validates). Keyed per variant and
      # ISO week so it refreshes as Valheim ships builds; saved even when the
      # suite fails, because the download happened either way.
      # ---------------------------------------------------------------------
      - name: Create cache directories
        run: |
          mkdir -p data/server
          mkdir -p data/config

      - name: Compute cache key
        id: cache-key
        run: echo "key=valheim-server-${{ env.VALHEIM_VARIANT }}-${{ env.VALHEIM_APP_ID }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # On the self-hosted pool the depot cache is already on local disk, kept
      # current by a root-owned timer. Copying from it beats pulling the same
      # gigabytes back from GitHub's cache service over the internet.
      # It is a copy, never a hardlink: the suite runs steamcmd against these
      # files, and a hardlink would let a job write through into the cache that
      # feeds every published image.
      - name: Seed server files from the local depot cache
        id: local-cache
        if: ${{ runner.environment == 'self-hosted' && github.event.inputs.skip_cache != 'true' }}
        run: |
          src="/srv/steam-cache/${{ env.VALHEIM_APP_ID }}"
          if [ -f "${src}/valheim_server.x86_64" ]; then
            cp -a "${src}/." data/server/
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "✅ seeded from ${src} ($(du -sh data/server | cut -f1))"
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ no usable local depot cache at ${src}; falling back"
          fi

      - name: Restore server file cache
        if: ${{ github.event.inputs.skip_cache != 'true' && steps.local-cache.outputs.seeded != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: server-cache
        with:
          path: data/server
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            valheim-server-${{ env.VALHEIM_VARIANT }}-${{ env.VALHEIM_APP_ID }}-

      - name: Cache status
        run: |
          if [ -f data/server/valheim_server.x86_64 ]; then
            echo "✅ Server files restored from cache (build $(cat data/server/.build_id 2>/dev/null || echo '?'))"
            du -sh data/server || true
          else
            echo "⚠️ No usable cache, server files will be downloaded"
          fi

      # ---------------------------------------------------------------------
      # Build Docker Image
      # ---------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: vanilla
          push: false
          load: true
          tags: absolute-valheim-server:test-vanilla
          cache-from: type=gha,scope=vanilla
          cache-to: type=gha,mode=max,scope=vanilla

      # ---------------------------------------------------------------------
      # Run E2E Tests
      # ---------------------------------------------------------------------
      - name: Make test scripts executable
        run: |
          chmod +x tests/run_e2e.sh
          chmod +x tests/test_helpers.sh
          chmod +x tests/e2e/*.sh

      - name: Cleanup any existing containers
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f valheim-server 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker volume rm valheim-test-config valheim-test-server 2>/dev/null || true

      - name: Run E2E test suite
        id: e2e-tests
        run: |
          ./tests/run_e2e.sh
        env:
          TEST_TIMEOUT: 600
          STARTUP_WAIT: 300
          # Mount ./data/{server,config} into the container so the cache above is used
          USE_BIND_MOUNTS: "true"

      # ---------------------------------------------------------------------
      # Collect Artifacts (always, for debugging)
      # ---------------------------------------------------------------------
      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker logs valheim-server > test-artifacts/container.log 2>&1 || true
          docker inspect valheim-server > test-artifacts/container-inspect.json 2>&1 || true
          cp -r data/logs/* test-artifacts/ 2>/dev/null || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-logs-vanilla
          path: test-artifacts/
          retention-days: 7

      # ---------------------------------------------------------------------
      # Cleanup (stop the container before touching the bind-mounted files)
      # ---------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f valheim-server 2>/dev/null || true
          docker volume rm valheim-test-config valheim-test-server 2>/dev/null || true

      # ---------------------------------------------------------------------
      # Update Server File Cache
      # ---------------------------------------------------------------------
      - name: Prepare server files for cache
        if: always() && runner.environment != 'self-hosted' && steps.server-cache.outputs.cache-hit != 'true'
        run: |
          # The container wrote these as root/uid 1000; the cache tar runs as the runner user
          sudo chown -R "$(id -u):$(id -g)" data/server
          # Drop Steam scratch space and the overlay's per-run log
          rm -rf data/server/steamapps/downloading data/server/steamapps/temp data/server/BepInEx/LogOutput.log
          du -sh data/server || true

      - name: Save server files to cache
        if: always() && runner.environment != 'self-hosted' && steps.server-cache.outputs.cache-hit != 'true' && hashFiles('data/server/valheim_server.x86_64') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/server
          key: ${{ steps.cache-key.outputs.key }}

  # -------------------------------------------------------------------------
  # Build Verification (both targets, no server download)
  # -------------------------------------------------------------------------
  build-only:
    name: Build Verification (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, bepinex]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.variant }}
          push: false
          load: true
          tags: absolute-valheim-server:build-test-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Verify image structure
        run: |
          IMG=absolute-valheim-server:build-test-${{ matrix.variant }}
          # Required scripts exist
          docker run --rm "$IMG" ls -la /opt/valheim/scripts/
          for s in bootstrap valheim-server valheim-updater valheim-backup valheim-dr valheim-modcheck valheim-bepinex healthcheck; do
            docker run --rm "$IMG" test -x "/opt/valheim/scripts/$s" || { echo "missing script: $s"; exit 1; }
          done
          # Scripts parse
          docker run --rm "$IMG" sh -c 'for f in /opt/valheim/scripts/*; do bash -n "$f" || exit 1; done'
          # steamcmd is installed
          docker run --rm "$IMG" ls -la /opt/steamcmd/
          # Supervisor config
          docker run --rm "$IMG" cat /etc/supervisor/conf.d/valheim.conf
          # Variant contract
          VARIANT=$(docker run --rm "$IMG" printenv VALHEIM_VARIANT)
          test "$VARIANT" = "${{ matrix.variant }}" || { echo "VALHEIM_VARIANT=$VARIANT"; exit 1; }
          # DR CLI answers without a server install
          docker run --rm "$IMG" /opt/valheim/scripts/valheim-dr status | jq -e '.variant == "${{ matrix.variant }}"'

      - name: Verify BepInEx overlay is pinned into the image
        if: matrix.variant == 'bepinex'
        run: |
          IMG=absolute-valheim-server:build-test-bepinex
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/BepInEx/core/BepInEx.Preloader.dll
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/doorstop_libs/libdoorstop_x64.so
          docker run --rm "$IMG" test -f /opt/valheim/bepinex/start_server_bepinex.sh
          PACK=$(docker run --rm "$IMG" cat /opt/valheim/bepinex/.pack_version)
          ENVV=$(docker run --rm "$IMG" printenv BEPINEX_VERSION)
          echo "pack=$PACK env=$ENVV"
          test "$PACK" = "$ENVV"
          docker run --rm "$IMG" sh -c 'test "$(printenv BEPINEX_ENABLED)" = true && test "$(printenv MODCHECK_STRICT)" = true && test "$(printenv DR_SNAPSHOT_BEFORE_UPDATE)" = true'

      - name: Verify vanilla image carries no BepInEx
        if: matrix.variant == 'vanilla'
        run: |
          IMG=absolute-valheim-server:build-test-vanilla
          if docker run --rm "$IMG" test -d /opt/valheim/bepinex; then echo "vanilla image contains BepInEx"; exit 1; fi
          docker run --rm "$IMG" sh -c 'test "$(printenv BEPINEX_ENABLED)" = false && test "$(printenv DR_SNAPSHOT_BEFORE_UPDATE)" = false'
